name: Benchmarks

on:
  pull_request:
    branches:
      - main

# Read-only token: fork PR code runs here, so results go to the job summary
# instead of a PR comment, and the cache stays scoped to the PR ref.
permissions:
  contents: read

# Cancel a superseded benchmark run when new commits land on the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          job-summary: 'true'
          # Use the PR's own benchmark/ scripts for both revisions.
          bench-on: ${{ github.event.pull_request.head.sha }}
